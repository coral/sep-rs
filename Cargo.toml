[workspace]
members = [
    "crates/sep-rs",
    "crates/sep-rs-cli",
    "crates/sep-rs-ffi",
]
default-members = [
    "crates/sep-rs",
    "crates/sep-rs-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/coral/sep-rs"
homepage = "https://github.com/coral/sep-rs"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
macaddr = { version = "1.0.1", features = ["serde_std"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
regex = "1.11.3"
secrecy = "0.10.3"
sep-rs = { version = "0.2.0", path = "crates/sep-rs" }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
uniffi = "=0.31.0"
url = { version = "2.5.8", features = ["serde"] }
wasm-bindgen = "0.2.127"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
